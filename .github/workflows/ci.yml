name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Ruff's result does not depend on the interpreter or the OS, so it runs once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  # The floor and the newest release, on both systems. mypy runs here rather
  # than in lint because it checks against the interpreter it runs on.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: mypy
      - run: pytest
