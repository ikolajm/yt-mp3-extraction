[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-mp3-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["yt-dlp[default, deno]"]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[project.scripts]
ytx = "yt_mp3_extraction.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
